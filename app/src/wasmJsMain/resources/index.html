<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Cross the Streams - Conflict Map</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #121318;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
        #ComposeTarget {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: block;
            /* The map handles its own drag/pinch; don't let the browser pan or zoom the page. */
            touch-action: none;
            overscroll-behavior: none;
        }
    </style>
</head>
<body>
    <canvas id="ComposeTarget"></canvas>

    <script>
        // Trackpad pinch arrives as ctrl+wheel. Without this the browser zooms the whole page
        // instead of the map. Compose still receives the event and zooms the map itself.
        window.addEventListener('wheel', function (event) {
            if (event.ctrlKey) event.preventDefault();
        }, { passive: false });
        // Safari's proprietary pinch events, same reason.
        ['gesturestart', 'gesturechange', 'gestureend'].forEach(function (type) {
            document.addEventListener(type, function (event) { event.preventDefault(); });
        });

        // Multi-touch fix for Compose for Web 1.7: it only reads `changedTouches`, so when a second
        // finger lands (or one finger lifts) the other finger is missing from the event and Compose
        // drops it. Pinch-zoom then degrades into a one-finger pan. Re-dispatch touch events to the
        // canvas so every event lists all fingers that are down.
        (function () {
            var relayed = new WeakSet();
            var toArray = function (list) { return Array.prototype.slice.call(list); };
            var relay = function (source, type, changed, touches) {
                var event = new TouchEvent(type, {
                    bubbles: true, cancelable: true, composed: true,
                    touches: touches, targetTouches: touches, changedTouches: changed,
                    ctrlKey: source.ctrlKey, shiftKey: source.shiftKey, altKey: source.altKey, metaKey: source.metaKey
                });
                relayed.add(event);
                source.target.dispatchEvent(event);
            };
            var onTouch = function (event) {
                if (relayed.has(event) || !event.target || event.target.id !== 'ComposeTarget') return;
                var down = toArray(event.touches);
                var changed = toArray(event.changedTouches);
                try {
                    if (event.type === 'touchstart' || event.type === 'touchmove') {
                        if (down.length <= changed.length) return;
                        relay(event, event.type, down, down);
                    } else {
                        if (down.length === 0) return;
                        // End the whole gesture, then restart it with the fingers still down.
                        relay(event, 'touchend', changed.concat(down), []);
                        relay(event, 'touchstart', down, down);
                    }
                } catch (e) {
                    return; // TouchEvent constructor unavailable: fall back to the original event.
                }
                event.stopImmediatePropagation();
                event.preventDefault();
            };
            ['touchstart', 'touchmove', 'touchend', 'touchcancel'].forEach(function (type) {
                window.addEventListener(type, onTouch, { capture: true, passive: false });
            });
        })();
    </script>
    <script type="application/javascript" src="app.js"></script>
</body>
</html>
